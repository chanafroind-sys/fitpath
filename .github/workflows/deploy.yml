# Build the investor demo, the embeddable widget and the fictional store that
# embeds it, and publish them to GitHub Pages as one site.
#
# The engine's tests run first and the job stops if they fail. The demo's only
# claim is that its numbers come from the engine, so shipping a demo built on an
# engine whose tests are red would publish exactly the thing this project says
# it does not do.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; let a run in progress finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck the engine
        run: npm --workspace @fitpath/engine run typecheck

      - name: Test the engine
        run: npm --workspace @fitpath/engine test

      - name: Test the illustrator and the widget
        run: |
          npm --workspace @fitpath/illustrate test
          npm --workspace @fitpath/widget test

      - name: Typecheck and build the demo
        run: npm --workspace @fitpath/demo run build

      # The embeddable widget and the fictional store that embeds it are
      # published beside the demo, so one Pages site shows all three: the
      # engine demo at /, the store at /store/, and the widget's files at
      # /store/widget/ — which is also where the store's script tag points.
      - name: Build the widget and the store that embeds it
        run: |
          npm --workspace @fitpath/widget run build
          npm --workspace @fitpath/store run build
          rm -rf apps/demo/dist/store
          cp -r apps/store/dist apps/demo/dist/store

      # Requires Pages to be switched on for the repository first:
      # Settings > Pages > Build and deployment > Source: "GitHub Actions".
      # This action can also enable it via the API, but the default GITHUB_TOKEN
      # is not permitted to create a Pages site, so that path just fails with
      # "Resource not accessible by integration". One manual click, once.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Declared on the job as well as on the workflow.
    #
    # `actions/deploy-pages` mints an OIDC token, and it reads the permissions
    # of the job it runs in rather than the workflow's. The workflow-level block
    # above is what the rest of the run uses and is not enough on its own — the
    # deploy failed with "ensure GITHUB_TOKEN has permission id-token: write"
    # while that permission was plainly granted a few lines higher up.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
